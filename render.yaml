services:
  - type: web
    name: love-proposal-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: PAGE_TITLE
        value: 'ငါ့ကို ချစ်လားဟင်? 🥺'
      - key: PAGE_MESSAGE
        value: 'အဖြေလေး ပေးပါဦးနော် 💗'
