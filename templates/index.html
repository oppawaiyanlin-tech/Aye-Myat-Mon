
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Love Proposal ❤️</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  padding: 10px 0;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
  background: linear-gradient(135deg,#fff0f6,#fff8fc);
  font-family: system-ui,"Noto Sans Myanmar",sans-serif;
  color: #603449;
}

.card {
  width: 95%;
  max-width: 550px;
  min-height: 0;
  padding: 14px 12px;
  background: white;
  border-radius: 26px;
  box-shadow: 0 12px 45px #e782ab35;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
}

#question {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 {
  width: 100%;
  margin: 8px 0 12px;
  color: #dd568a;
  font-size: clamp(22px,6vw,36px);
  white-space: nowrap;
}

#media {
  display: block;
  width: min(58vw,230px);
  height: clamp(130px,24vh,205px);
  object-fit: contain;
}

#text {
  width: 100%;
  min-height: 48px;
  margin: 10px 0 12px;
  padding: 5px 0;
  color: #603449;
  font-weight: 800;
  line-height: 1.5;
  text-align: center;
  white-space: nowrap;
  overflow: visible;
}

/* ခလုတ်များကို အပေါ်အောက်စီထားမယ် */
.buttons {
  width: 100%;
  height: 145px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 9px;
  overflow: visible;
  isolation: isolate;
}

button {
  border: none;
  border-radius: 17px;
  color: white;
  font-family: inherit;
  font-weight: bold;
  white-space: nowrap;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

#yes {
  position: relative;
  z-index: 5;
  width: 78%;
  max-width: 320px;
  height: 62px;
  padding: 8px;
  background: #20b45a;
  font-size: 24px;
  transform: scale(1);
  transform-origin: center center;
  transition: transform .2s ease;
}

#no {
  position: relative;
  z-index: 4;
  width: 65%;
  max-width: 270px;
  height: 58px;
  padding: 8px;
  background: #f16b65;
  font-size: 21px;
}

/* ၇ ကြိမ်မြောက်မှာ YES က NO ကို လုံးဝဖုံးမယ် */
.buttons.final-step #yes {
  position: absolute;
  z-index: 20;
  top: 0;
  left: 0;
  width: 100%;
  max-width: none;
  height: 100%;
  min-height: 100%;
  transform: none !important;
  font-size: 29px;
}

.buttons.final-step #no {
  visibility: hidden;
  pointer-events: none;
}

#loading {
  margin-top: 5px;
  color: #d45c91;
  font-size: 12px;
}

#finish {
  display: none;
  width: 100%;
  padding: 20px 0;
  text-align: center;
}

#finish .headline {
  margin: 15px 0;
  color: #e45591;
  font-size: clamp(30px,8vw,42px);
  font-weight: 900;
  white-space: nowrap;
}

#finish .finaltext {
  width: 100%;
  margin: 15px auto;
  color: #d54f87;
  font-size: clamp(16px,5vw,27px);
  font-weight: 900;
  white-space: nowrap;
}

#finish img {
  display: block;
  width: min(70vw,250px);
  height: 220px;
  object-fit: contain;
  margin: 12px auto 0;
}

.heart {
  position: fixed;
  top: -45px;
  pointer-events: none;
  z-index: 30;
  animation: fall 5s linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(300deg);
    opacity: 0;
  }
}

@media (max-height:750px) {
  .card {
    padding-top: 8px;
    padding-bottom: 8px;
  }

  h1 {
    margin: 5px 0 7px;
  }

  #media {
    height: clamp(105px,19vh,150px);
  }

  #text {
    min-height: 40px;
    margin: 5px 0 7px;
  }

  .buttons {
    height: 125px;
    gap: 7px;
  }

  #yes {
    height: 55px;
  }

  #no {
    height: 52px;
  }
}
</style>
</head>

<body>

<main class="card">

<section id="question">

<h1>__PAGE_TITLE__</h1>

<img
  id="media"
  src="/static/gifs/intro.gif"
  alt="Love GIF"
>

<div id="text">__PAGE_MESSAGE__</div>

<div class="buttons" id="buttons">

<button id="yes">ချစ်တယ် ❤️</button>

<button id="no">မချစ်ဘူး 💔</button>

</div>

<div id="loading">ပုံများကို ကြိုတင်ပြင်ဆင်နေပါတယ် 💗</div>

</section>

<section id="finish">

<div class="headline">ယေး! 🎉</div>

<div class="finaltext">
ကိုယ်လည်း မင်းကို အရမ်းချစ်ပါတယ် ❤
</div>

<img src="/static/gifs/yes.gif" alt="Happy GIF">

</section>

</main>

<script>
const messages = [
  'အာ့လိုကြီးတော့ မငြင်းပါနဲ့ဗျာ 🥺',
  'ငိုမှာနော် 😢',
  'မရက်စက်လိုက်ပါနဲ့နော် 💔',
  'တစ်ခါလောက်တော့ စဉ်းစားပေးပါဦး 🥹',
  'အရမ်းချစ်မိနေလို့ပါနော် 🥺',
  'နောက်တစ်ခါလောက် ပြန်စဉ်းစားပေးပါနော် 😿',
  'ချစ်တယ်ပြောရင် မုန့်ဝယ်ကျွေးမယ်လေနော် 🥲',
  'ကဲပါကွာ... ချစ်တယ်လို့ပဲ ပြောလိုက်ပါတော့နော် 💗'
];

const gifPaths = [
  '/static/gifs/step1.gif',
  '/static/gifs/step2.gif',
  '/static/gifs/step3.gif',
  '/static/gifs/step4.gif',
  '/static/gifs/step5.gif',
  '/static/gifs/step6.gif',
  '/static/gifs/step7.gif',
  '/static/gifs/step8.gif'
];

let clicks = 0;
let finished = false;
let gifsReady = false;

const yes = document.getElementById('yes');
const no = document.getElementById('no');
const text = document.getElementById('text');
const media = document.getElementById('media');
const buttons = document.getElementById('buttons');
const loading = document.getElementById('loading');

const question = document.getElementById('question');
const finish = document.getElementById('finish');

const preloadedGifs = [];

/* စာသားကို တစ်ကြောင်းတည်းနဲ့ အကျယ်အလိုက် ချိန်မယ် */
function fitText(element, maxSize, minSize) {
  let size = maxSize;

  element.style.fontSize = size + 'px';

  while (
    element.scrollWidth > element.clientWidth &&
    size > minSize
  ) {
    size -= 1;
    element.style.fontSize = size + 'px';
  }
}

/* GIF အားလုံးကို ကြိုတင် Load လုပ်ထားမယ် */
async function preloadGif(path) {
  return new Promise(resolve => {
    const img = new Image();

    img.onload = async () => {
      try {
        if (img.decode) {
          await img.decode();
        }
      } catch (e) {}

      resolve(img);
    };

    img.onerror = () => resolve(null);
    img.src = path;
  });
}

async function prepareGifs() {
  const paths = [
    '/static/gifs/intro.gif',
    ...gifPaths,
    '/static/gifs/yes.gif'
  ];

  const results = await Promise.all(
    paths.map(path => preloadGif(path))
  );

  results.forEach((img, index) => {
    preloadedGifs[index] = img;
  });

  gifsReady = true;
  loading.style.display = 'none';
}

function showGif(index) {
  const img = preloadedGifs[index];

  if (img) {
    media.src = img.src;
  } else {
    media.src = gifPaths[index - 1];
  }
}

/* NO ကိုနှိပ်တိုင်း စာနဲ့ GIF ချက်ချင်းပြောင်းမယ် */
no.addEventListener('click', () => {
  if (finished || !gifsReady) return;

  clicks++;

  const index = clicks - 1;

  text.textContent = messages[index];

  showGif(index + 1);

  fitText(text, 23, 10);

  /* ၁ ကြိမ်မှ ၆ ကြိမ်အထိ YES တဖြည်းဖြည်းကြီးမယ် */
  if (clicks < 7) {
    const scale = 1 + clicks * 0.13;
    yes.style.transform = `scale(${scale})`;
  }

  /* ၇ ကြိမ်မြောက်မှာ NO ကို YES က လုံးဝဖုံးမယ် */
  if (clicks >= 7) {
    buttons.classList.add('final-step');
  }
});

/* YES နှိပ်ရင် အောင်မြင်တဲ့အဆုံးသတ် */
yes.addEventListener('click', () => {
  if (finished) return;

  finished = true;

  question.style.display = 'none';
  finish.style.display = 'block';

  fitText(
    finish.querySelector('.finaltext'),
    28,
    12
  );

  const yesGif = preloadedGifs[9];

  if (yesGif) {
    finish.querySelector('img').src = yesGif.src;
  }

  for (let i = 0; i < 35; i++) {
    setTimeout(makeHeart, i * 70);
  }
});

/* နှလုံးပုံလေးတွေ */
function makeHeart() {
  const heart = document.createElement('span');

  heart.className = 'heart';
  heart.textContent = ['💗','💕','💖','🌸'][Math.floor(Math.random() * 4)];

  heart.style.left = Math.random() * 100 + 'vw';
  heart.style.fontSize = (18 + Math.random() * 20) + 'px';

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 5500);
}

setInterval(() => {
  if (!finished) makeHeart();
}, 1300);

/* စာသားအရွယ်ကို ဖုန်းအကျယ်အလိုက် ချိန်မယ် */
function resizeText() {
  fitText(text, 23, 10);

  const finalText = finish.querySelector('.finaltext');
  fitText(finalText, 28, 12);
}

window.addEventListener('resize', resizeText);

/* စာမျက်နှာစတင်ချိန်မှာ GIF ကြိုတင်ပြင်ဆင်မယ် */
prepareGifs().then(() => {
  resizeText();
});
</script>

</body>
</html>
