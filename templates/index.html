
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff0f6">
<title>Love Proposal ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 12px;
  background: linear-gradient(135deg,#fff0f6,#fff8fc);
  font-family: system-ui,"Noto Sans Myanmar",sans-serif;
  color: #603449;
  overflow-x: hidden;
}

/* LOADING SCREEN */
#loader {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: linear-gradient(135deg,#fff0f6,#fff8fc);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

#loader img {
  width: min(72vw,300px);
  height: 260px;
  object-fit: contain;
}

#loader .creator {
  font-size: clamp(17px,4.5vw,22px);
  font-weight: 800;
  color: #d6538c;
  margin-top: 12px;
}

#loader .waiting {
  font-size: 12px;
  color: #a77b91;
  margin-top: 9px;
  font-weight: 500;
}

#loader .progress {
  width: min(65vw,220px);
  height: 5px;
  border-radius: 20px;
  background: #f8d8e6;
  overflow: hidden;
  margin-top: 18px;
}

#loader .progress-bar {
  width: 0%;
  height: 100%;
  background: #e65c98;
  transition: width .2s linear;
}

/* MAIN CARD */
.card {
  width: 100%;
  max-width: 550px;
  min-height: 650px;
  background: white;
  border-radius: 28px;
  box-shadow: 0 12px 45px #e782ab35;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px 15px;
  position: relative;
  overflow: hidden;
}

#question {
  width: 100%;
}

h1 {
  font-size: clamp(25px,7vw,38px);
  line-height: 1.5;
  color: #dd568a;
  margin: 8px 0 22px;
}

#media {
  display: block;
  width: min(68vw,260px);
  height: 240px;
  object-fit: contain;
  margin: 0 auto;
}

#text {
  width: 100%;
  font-size: clamp(19px,5.2vw,26px);
  font-weight: bold;
  line-height: 1.6;
  margin: 18px auto 30px;
  overflow-wrap: anywhere;
}

.buttons {
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  position: relative;
  min-height: 170px;
}

button {
  border: 0;
  border-radius: 20px;
  padding: 18px 12px;
  width: 86%;
  min-height: 76px;
  color: white;
  font-weight: bold;
  font-size: clamp(21px,6vw,30px);
  font-family: inherit;
  cursor: pointer;
  touch-action: manipulation;
}

#yes {
  background: #20b45a;
  position: relative;
  z-index: 3;
  transform: none;
  transform-origin: top center;
  transition: height .35s ease, min-height .35s ease;
}

#no {
  background: #f16b65;
  position: relative;
  z-index: 2;
  transition: opacity .2s;
}

/* YES covers NO from top to bottom */
#yes.cover-all {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  min-height: 100%;
  z-index: 5;
  border-radius: 20px;
  padding: 0;
}

/* FINISH */
#finish {
  display: none;
  width: 100%;
  text-align: center;
}

#finish .headline {
  font-size: clamp(30px,8vw,42px);
  font-weight: 800;
  color: #e45591;
  margin: 15px 0;
}

#finish .finaltext {
  white-space: nowrap;
  font-size: clamp(12px,3.8vw,21px);
  font-weight: bold;
  color: #d54f87;
}

#finish img {
  width: min(75vw,280px);
  height: 250px;
  object-fit: contain;
  margin-top: 16px;
}

/* FALLING HEARTS */
.heart {
  position: fixed;
  top: -40px;
  pointer-events: none;
  animation: fall 5s linear forwards;
  z-index: 10;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(300deg);
    opacity: 0;
  }
}

@media (max-width:380px) {
  .card {
    min-height: 600px;
    padding: 20px 10px;
  }

  #text {
    font-size: 18px;
  }

  button {
    width: 90%;
  }
}
</style>
</head>

<body>

<!-- LOADING SCREEN -->
<div id="loader">
  <img
    src="/static/gifs/loading.gif"
    alt="Loading"
    fetchpriority="high"
  >

  <div class="creator">
    BuBu DuDu Myanmar မှ ဖန်တီးထားသည်
  </div>

  <div class="waiting">
    ခဏစောင့်ပါ 💗
  </div>

  <div class="progress">
    <div class="progress-bar" id="progressBar"></div>
  </div>
</div>

<!-- MAIN WEBSITE -->
<main class="card" id="mainCard" style="visibility:hidden">

<section id="question">

<h1>__PAGE_TITLE__</h1>

<img
  id="media"
  src="/static/gifs/intro.gif"
  alt="Love GIF"
>

<div id="text">__PAGE_MESSAGE__</div>

<div class="buttons" id="buttons">

<button id="yes">ချစ်တယ် ❤️</button>

<button id="no">မချစ်ဘူး 💔</button>

</div>
</section>

<section id="finish">

<div class="headline">ယေး! 🎉</div>

<div class="finaltext">
ငါလည်း နင့်ကိုအရမ်းချစ်တယ် ❤
</div>

<img
  src="/static/gifs/yes.gif"
  alt="Happy GIF"
>

</section>

</main>

<script>
/* ALL GIF FILES */
const gifPaths = [
  '/static/gifs/intro.gif',
  '/static/gifs/step1.gif',
  '/static/gifs/step2.gif',
  '/static/gifs/step3.gif',
  '/static/gifs/step4.gif',
  '/static/gifs/step5.gif',
  '/static/gifs/step6.gif',
  '/static/gifs/step7.gif',
  '/static/gifs/step8.gif',
  '/static/gifs/yes.gif'
];

/* NO CLICK MESSAGES */
const messages = [
  'အာ့လိုကြီးတော့ မငြင်းပါနဲ့ဗျာ 🥺',
  'ငိုမှာနော် 😢',
  'မရက်စက်လိုက်ပါနော် 💔',
  'သေချာ စဉ်းစားပေးပါဦး 🥹',
  'အရမ်းချစ်မိနေလို့ပါနော် 🥺',
  'နောက်တစ်ခါလောက် ပြန်စဉ်းစားပေးပါနော် 🤗',
  'ချစ်တယ်ပြောရင် မုန့်ဝယ်ကျွေးမယ်လေနော် 🥲',
  'ကဲပါကွာ... ချစ်တယ်လို့ပဲ ပြောလိုက်ပါတော့နော် 💗'
];

let clicks = 0;
let finished = false;
let readyCount = 0;

const loader = document.getElementById('loader');
const mainCard = document.getElementById('mainCard');
const progressBar = document.getElementById('progressBar');

const yes = document.getElementById('yes');
const no = document.getElementById('no');
const text = document.getElementById('text');
const media = document.getElementById('media');

const question = document.getElementById('question');
const finish = document.getElementById('finish');

/* PRELOAD ALL GIFS BEFORE SHOWING WEBSITE */
function preloadOne(path) {
  return new Promise((resolve, reject) => {
    const img = new Image();

    img.onload = async () => {
      try {
        if (img.decode) {
          await img.decode();
        }
        resolve(path);
      } catch (error) {
        // Image has loaded; decoding may be unsupported.
        resolve(path);
      }
    };

    img.onerror = () => {
      reject(path);
    };

    img.src = path;

    if (img.complete && img.naturalWidth > 0) {
      resolve(path);
    }
  });
}

async function prepareWebsite() {
  const results = await Promise.allSettled(
    gifPaths.map(async (path) => {
      await preloadOne(path);

      readyCount++;

      progressBar.style.width =
        (readyCount / gifPaths.length * 100) + '%';

      return path;
    })
  );

  const failed = results.filter(
    result => result.status === 'rejected'
  );

  if (failed.length > 0) {
    document.querySelector('#loader .waiting').textContent =
      'GIF ဖိုင်တချို့ Load မဖြစ်သေးပါ။ ဖိုင်တွေကို စစ်ဆေးပေးပါ။';

    return;
  }

  // All GIFs are ready.
  mainCard.style.visibility = 'visible';

  loader.style.opacity = '0';
  loader.style.transition = 'opacity .3s ease';

  setTimeout(() => {
    loader.style.display = 'none';
  }, 300);
}

prepareWebsite();

/* CHANGE NO GIF AND MESSAGE IMMEDIATELY */
no.addEventListener('click', () => {
  if (finished || clicks >= 8) return;

  const index = clicks;

  text.textContent = messages[index];

  // Change GIF immediately.
  media.src = gifPaths[index + 1];

  clicks++;

  // Grow YES button progressively.
  if (clicks < 8) {
    const percent = 86 + clicks * 1.75;
    yes.style.width = Math.min(percent, 100) + '%';
  }

  // On the 8th NO click, YES completely covers NO.
  if (clicks === 8) {
    yes.classList.add('cover-all');
    no.style.visibility = 'hidden';
  }
});

/* YES BUTTON: ENTIRE GREEN AREA IS CLICKABLE */
yes.addEventListener('click', () => {
  if (finished) return;

  finished = true;

  question.style.display = 'none';
  finish.style.display = 'block';

  for (let i = 0; i < 40; i++) {
    setTimeout(makeHeart, i * 75);
  }
});

/* HEART ANIMATION */
function makeHeart() {
  const h = document.createElement('span');

  h.className = 'heart';

  h.textContent = ['💗','💕','💖','🌸'][
    Math.floor(Math.random() * 4)
  ];

  h.style.left = Math.random() * 100 + 'vw';
  h.style.fontSize = (18 + Math.random() * 20) + 'px';

  document.body.appendChild(h);

  setTimeout(() => h.remove(), 6000);
}

setInterval(() => {
  if (!finished) makeHeart();
}, 1100);

</script>

</body>
</html>
