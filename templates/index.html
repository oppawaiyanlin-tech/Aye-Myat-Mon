
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff0f6">
<title>Love Proposal ❤️</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
  margin: 0;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  min-height: 100dvh;
  padding: 10px 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
  background: linear-gradient(135deg,#fff0f6,#fff8fc);
  font-family: system-ui, "Noto Sans Myanmar", sans-serif;
  color: #603449;
}

.card {
  width: 100%;
  max-width: 550px;
  height: calc(100vh - 20px);
  height: calc(100dvh - 20px);
  max-height: 900px;
  min-height: 0;
  background: white;
  border-radius: 25px;
  box-shadow: 0 12px 45px #e782ab35;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 14px 12px;
  position: relative;
  overflow: hidden;
}

#question {
  width: 100%;
  height: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-evenly;
}

h1 {
  width: 100%;
  font-size: clamp(24px, 6vw, 36px);
  line-height: 1.5;
  color: #dd568a;
  margin: 5px 0;
  overflow-wrap: anywhere;
}

#media {
  display: block;
  width: min(75vw, 300px);
  height: min(27dvh, 250px);
  object-fit: contain;
  flex-shrink: 1;
}

#text {
  width: 100%;
  font-size: clamp(16px, 4.4vw, 25px);
  font-weight: bold;
  line-height: 1.7;
  margin: 5px 0;
  overflow-wrap: anywhere;
}

/* ခလုတ်များကို အပေါ်အောက် စီထားမယ် */
.buttons {
  width: 100%;
  min-height: 132px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 12px;
  position: relative;
  overflow: visible;
  isolation: isolate;
}

button {
  width: min(85%, 360px);
  height: 60px;
  min-height: 60px;
  padding: 10px;
  border: 0;
  border-radius: 18px;
  color: white;
  font-family: inherit;
  font-size: clamp(19px, 5vw, 27px);
  font-weight: bold;
  cursor: pointer;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}

#yes {
  background: #20b45a;
  position: relative;
  z-index: 5;
  overflow: visible;
  flex-shrink: 0;
  isolation: isolate;
}

#yes span {
  position: relative;
  z-index: 2;
}

/* အစိမ်းရောင်အပိုင်းကို အောက်ဘက်သို့သာ ချဲ့မယ် */
#yes::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--cover-height, 60px);
  background: #20b45a;
  border-radius: 18px;
  z-index: 1;
  pointer-events: none;
  transition: height 0.35s ease;
}

#no {
  background: #f16b65;
  position: relative;
  z-index: 1;
  flex-shrink: 0;
  transition: opacity 0.2s ease;
}

button:disabled {
  opacity: 0.55;
  cursor: wait;
}

#loading {
  font-size: 14px;
  color: #d54f87;
  margin-top: 5px;
}

#finish {
  display: none;
  width: 100%;
  text-align: center;
}

#finish .headline {
  font-size: clamp(25px, 7vw, 38px);
  font-weight: 800;
  color: #e45591;
  margin: 15px 0;
}

#finish .finaltext {
  width: 100%;
  white-space: nowrap;
  font-size: clamp(13px, 3.8vw, 22px);
  font-weight: bold;
  color: #d54f87;
}

#finish img {
  width: min(75vw, 300px);
  height: min(30dvh, 260px);
  object-fit: contain;
  margin-top: 16px;
}

.heart {
  position: fixed;
  top: -40px;
  pointer-events: none;
  z-index: 10;
  animation: fall 5s linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(300deg);
    opacity: 0;
  }
}

@media (max-height: 650px) {
  #media {
    height: 20dvh;
  }

  .buttons {
    min-height: 132px;
  }
}
</style>
</head>

<body>

<main class="card">

<section id="question">

<h1>__PAGE_TITLE__</h1>

<img
  id="media"
  src="/static/gifs/intro.gif"
  alt="Love GIF"
  loading="eager"
>

<div id="text">__PAGE_MESSAGE__</div>

<div class="buttons" id="buttons">

<button id="yes">
  <span>ချစ်တယ် ❤️</span>
</button>

<button id="no" disabled>
  ပုံများပြင်ဆင်နေသည်...
</button>

</div>

<div id="loading">
  ပုံများကို ကြိုတင်ပြင်ဆင်နေပါတယ် 💗
</div>

</section>

<section id="finish">

<div class="headline">ယေး! 🎉</div>

<div class="finaltext">
ကိုယ်လည်း မင်းကိုအရမ်းချစ်ပါတယ် ❤
</div>

<img
  src="/static/gifs/yes.gif"
  alt="Happy GIF"
>

</section>

</main>

<script>
const messages = [
  'အာ့လိုကြီးတော့ မငြင်းပါနဲ့ဗျာ 🥺',
  'ငိုမှာနော် 😢',
  'မရက်စက်လိုက်ပါနော် 💔',
  'တစ်ခါလောက်တော့ စဉ်းစားပေးပါဦး 🥹',
  'ကိုယ်ကတော့ အရမ်းချစ်နေတာနော် 🥺',
  'နောက်တစ်ခါလောက် ပြန်စဉ်းစားပေးပါနော် 😿',
  'ချစ်တယ်ပြောရင် မုန့်ဝယ်ကျွေးမယ်လေနော် 🥲',
  'ကဲပါကွာ... ချစ်တယ်လို့ပဲ ပြောလိုက်ပါတော့နော် 💗'
];

const gifPaths = [
  '/static/gifs/step1.gif',
  '/static/gifs/step2.gif',
  '/static/gifs/step3.gif',
  '/static/gifs/step4.gif',
  '/static/gifs/step5.gif',
  '/static/gifs/step6.gif',
  '/static/gifs/step7.gif',
  '/static/gifs/step8.gif'
];

let clicks = 0;
let finished = false;

const yes = document.getElementById('yes');
const no = document.getElementById('no');
const text = document.getElementById('text');
const media = document.getElementById('media');
const loading = document.getElementById('loading');

const question = document.getElementById('question');
const finish = document.getElementById('finish');

/* GIF များအားလုံး ကြိုတင် Load လုပ်မယ် */
function preloadImage(path) {
  return new Promise((resolve) => {
    const img = new Image();

    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);

    img.src = path;

    if (img.complete && img.naturalWidth > 0) {
      resolve(true);
    }
  });
}

async function preloadAllGifs() {
  const paths = [
    '/static/gifs/intro.gif',
    ...gifPaths,
    '/static/gifs/yes.gif'
  ];

  await Promise.all(paths.map(preloadImage));

  loading.style.display = 'none';
  no.disabled = false;
  no.textContent = 'မချစ်ဘူး 💔';
}

preloadAllGifs();

/* မချစ်ဘူး ခလုတ် */
no.addEventListener('click', () => {

  if (finished || clicks >= 8 || no.disabled) {
    return;
  }

  const index = clicks;

  /* စာသားနဲ့ GIF ကို ချက်ချင်းပြောင်းမယ် */
  text.textContent = messages[index];
  media.src = gifPaths[index];

  clicks++;

  /*
    ၁ မှ ၇ ကြိမ်အထိ အစိမ်းရောင်အပိုင်းကို
    အနည်းငယ်စီသာ အောက်ဘက်ချဲ့မယ်။

    ၈ ကြိမ်မြောက်မှ မချစ်ဘူးကို
    လုံးဝဖုံးနိုင်တဲ့အမြင့် သတ်မှတ်မယ်။
  */

  let coverHeight;

  if (clicks < 8) {
    coverHeight = 60 + (clicks * 4);
  } else {
    coverHeight = 140;
  }

  yes.style.setProperty(
    '--cover-height',
    coverHeight + 'px'
  );

  /* ၈ ကြိမ်မြောက်မှာ NO ကို လုံးဝဖုံးမယ် */
  if (clicks === 8) {
    no.style.pointerEvents = 'none';
    no.setAttribute('aria-hidden', 'true');
  }

});

/* ချစ်တယ် ခလုတ် */
yes.addEventListener('click', () => {

  if (finished) {
    return;
  }

  finished = true;

  question.style.display = 'none';
  finish.style.display = 'block';

  for (let i = 0; i < 40; i++) {
    setTimeout(makeHeart, i * 75);
  }

});

/* နှလုံးပုံလေးများ */
function makeHeart() {

  const heart = document.createElement('span');

  heart.className = 'heart';

  heart.textContent = [
    '💗',
    '💕',
    '💖',
    '🌸'
  ][Math.floor(Math.random() * 4)];

  heart.style.left =
    Math.random() * 100 + 'vw';

  heart.style.fontSize =
    (18 + Math.random() * 20) + 'px';

  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 6000);

}

/* အလှဆင်နှလုံးပုံများ */
setInterval(() => {
  if (!finished) {
    makeHeart();
  }
}, 1100);

</script>

</body>
</html>
