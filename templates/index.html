
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff0f6">
<title>Love Proposal ❤️</title>

<style>
* {
  box-sizing: border-box;
}

html {
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 12px 0;
  background: linear-gradient(135deg, #fff0f6, #fff8fc);
  font-family: system-ui, "Noto Sans Myanmar", sans-serif;
  color: #603449;
  overflow-x: hidden;
}

.card {
  width: 95%;
  max-width: 550px;
  min-height: min(850px, 94vh);
  min-height: min(850px, 94dvh);
  background: white;
  border-radius: 28px;
  box-shadow: 0 12px 45px #e782ab35;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px 14px;
  position: relative;
  overflow: visible;
}

#question {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 {
  width: 100%;
  font-size: clamp(25px, 6.5vw, 38px);
  line-height: 1.5;
  color: #dd568a;
  margin: 10px 0 25px;
  overflow-wrap: anywhere;
}

#media {
  display: block;
  width: min(65vw, 250px);
  height: 230px;
  object-fit: contain;
  margin: 5px auto 10px;
}

#text {
  width: 100%;
  font-size: clamp(18px, 5vw, 27px);
  font-weight: bold;
  line-height: 1.65;
  margin: 12px 0 25px;
  overflow-wrap: anywhere;
  color: #603449;
  text-align: center;
}

.buttons {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 14px;
  position: relative;
  overflow: visible;
  isolation: isolate;
  padding: 8px 0 15px;
}

button {
  width: 86%;
  min-height: 82px;
  border: 0;
  border-radius: 22px;
  padding: 15px 12px;
  color: white;
  font-family: inherit;
  font-size: clamp(23px, 6vw, 32px);
  font-weight: bold;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* YES အပေါ်မှာ အမြဲရှိမယ် */
#yes {
  order: 1;
  position: relative;
  z-index: 5;
  background: #20b45a;
  overflow: visible;
  isolation: isolate;
}

/* အစိမ်းရောင်ကို အောက်ဘက်သို့သာ ချဲ့မယ် */
#yes::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: calc(100% + var(--cover-extra, 0px));
  background: #20b45a;
  border-radius: 22px;
  z-index: 1;
  pointer-events: auto;
  transition: height 0.35s ease;
}

/* YES စာသားကို အပေါ်မှာ မြင်ရမယ် */
#yes span {
  position: relative;
  z-index: 2;
  pointer-events: none;
}

/* NO အောက်မှာ အမြဲရှိမယ် */
#no {
  order: 2;
  position: relative;
  z-index: 4;
  background: #f16b65;
  transition: opacity 0.25s ease;
}

/* Loading */
#loading {
  font-size: 14px;
  color: #d65a91;
  margin-top: 10px;
}

/* Finish screen */
#finish {
  display: none;
  width: 100%;
  text-align: center;
}

#finish .headline {
  font-size: clamp(30px, 8vw, 42px);
  font-weight: 800;
  color: #e45591;
  margin: 15px 0;
}

#finish .finaltext {
  width: 100%;
  white-space: nowrap;
  font-size: clamp(13px, 4vw, 23px);
  font-weight: bold;
  color: #d54f87;
  margin: 15px 0;
}

#finish img {
  display: block;
  width: min(75vw, 270px);
  height: 240px;
  object-fit: contain;
  margin: 15px auto;
}

/* Floating hearts */
.heart {
  position: fixed;
  top: -45px;
  pointer-events: none;
  animation: fall 5s linear forwards;
  z-index: 10;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(300deg);
    opacity: 0;
  }
}

/* Small phone screens */
@media (max-width: 380px) {
  .card {
    padding: 20px 10px;
  }

  #media {
    width: min(62vw, 210px);
    height: 205px;
  }

  #text {
    font-size: clamp(16px, 4.7vw, 21px);
  }

  button {
    width: 90%;
    min-height: 74px;
    font-size: clamp(21px, 5.8vw, 27px);
  }
}

</style>
</head>

<body>

<main class="card">

<section id="question">

<h1>__PAGE_TITLE__</h1>

<img
  id="media"
  src="/static/gifs/intro.gif"
  alt="Love GIF"
  fetchpriority="high"
>

<div id="text">__PAGE_MESSAGE__</div>

<div class="buttons" id="buttons">

<button id="yes" type="button">
  <span>ချစ်တယ် ❤️</span>
</button>

<button id="no" type="button">
  မချစ်ဘူး 💔
</button>

</div>

<div id="loading">
  ပုံများကို ကြိုတင်ပြင်ဆင်နေပါတယ် 💗
</div>

</section>

<section id="finish">

<div class="headline">ယေး! 🎉</div>

<div class="finaltext">
  ကိုယ်လည်း မင်းကို အရမ်းချစ်ပါတယ် ❤
</div>

<img
  src="/static/gifs/yes.gif"
  alt="Happy GIF"
>

</section>

</main>

<script>
const messages = [
  'အာ့လိုကြီးတော့ မငြင်းပါနဲ့ဗျာ 🥺',
  'ငိုမှာနော် 😢',
  'မရက်စက်လိုက်ပါနဲ့နော် 💔',
  'တစ်ခါလောက်တော့ စဉ်းစားပေးပါဦး 🥹',
  'အရမ်းချစ်မိနေလို့ပါနော် 🥺',
  'နောက်တစ်ခါလောက် ပြန်စဉ်းစားပေးပါနော် 😿',
  'ချစ်တယ်ပြောရင် မုန့်ဝယ်ကျွေးမယ်လေနော် 🥲',
  'ကဲပါကွာ... ချစ်တယ်လို့ပဲ ပြောလိုက်ပါတော့နော် 💗'
];

const gifPaths = [
  '/static/gifs/step1.gif',
  '/static/gifs/step2.gif',
  '/static/gifs/step3.gif',
  '/static/gifs/step4.gif',
  '/static/gifs/step5.gif',
  '/static/gifs/step6.gif',
  '/static/gifs/step7.gif',
  '/static/gifs/step8.gif'
];

let clicks = 0;
let finished = false;
let gifsReady = false;

const yes = document.getElementById('yes');
const no = document.getElementById('no');
const text = document.getElementById('text');
const media = document.getElementById('media');
const loading = document.getElementById('loading');

const question = document.getElementById('question');
const finish = document.getElementById('finish');
const buttons = document.getElementById('buttons');

/* GIF အားလုံးကို ကြိုတင် Load လုပ်ထားမယ် */
const gifCache = new Map();

function preloadGif(path) {
  return new Promise((resolve) => {
    const img = new Image();

    img.onload = () => {
      gifCache.set(path, img);
      resolve(true);
    };

    img.onerror = () => {
      resolve(false);
    };

    img.src = path;
  });
}

async function prepareGifs() {
  const allPaths = [
    '/static/gifs/intro.gif',
    ...gifPaths,
    '/static/gifs/yes.gif'
  ];

  await Promise.all(allPaths.map(preloadGif));

  gifsReady = true;
  loading.style.display = 'none';
  no.disabled = false;
  no.textContent = 'မချစ်ဘူး 💔';
}

/* GIF ကို ချက်ချင်းပြောင်းမယ် */
function changeGif(path) {
  const cached = gifCache.get(path);

  if (cached && cached.complete) {
    media.src = path;
  } else {
    media.src = path;
  }
}

/* YES အစိမ်းရောင်က NO ကို အောက်ဘက်ကနေ မဟုတ်ဘဲ
   အပေါ်ကနေ အောက်ဘက်သို့ တဖြည်းဖြည်း ဖုံးမယ် */
function updateCover() {
  const noBottom =
    no.offsetTop + no.offsetHeight;

  const yesHeight = yes.offsetHeight;

  const neededCover = Math.max(
    0,
    noBottom - yes.offsetTop - yesHeight
  );

  const progress = Math.min(clicks / 8, 1);

  const coverHeight = neededCover * progress;

  yes.style.setProperty(
    '--cover-extra',
    coverHeight + 'px'
  );

  if (clicks >= 8) {
    no.style.visibility = 'hidden';
    no.style.pointerEvents = 'none';
  }
}

/* NO ကို နှိပ်တဲ့အခါ */
no.addEventListener('click', () => {
  if (finished || !gifsReady || clicks >= 8) {
    return;
  }

  const index = clicks;

  /* စာသားနှင့် GIF တစ်ပြိုင်နက် ပြောင်းမယ် */
  text.textContent = messages[index];
  changeGif(gifPaths[index]);

  clicks++;

  /* အစိမ်းရောင်အပိုင်းကို တဖြည်းဖြည်း အောက်ချဲ့မယ် */
  requestAnimationFrame(() => {
    updateCover();
  });

  /* ၈ ကြိမ်ပြည့်လျှင် NO ကို အပြီးဖုံးမယ် */
  if (clicks === 8) {
    requestAnimationFrame(() => {
      updateCover();
    });
  }
});

/* YES အစိမ်းရောင်ဧရိယာ ဘယ်နေရာနှိပ်နှိပ် အလုပ်လုပ်မယ် */
yes.addEventListener('click', () => {
  if (finished) return;

  finished = true;

  question.style.display = 'none';
  finish.style.display = 'block';

  for (let i = 0; i < 40; i++) {
    setTimeout(makeHeart, i * 75);
  }
});

/* Floating hearts */
function makeHeart() {
  const h = document.createElement('span');

  h.className = 'heart';

  h.textContent = [
    '💗',
    '💕',
    '💖',
    '🌸',
    '💞'
  ][Math.floor(Math.random() * 5)];

  h.style.left = Math.random() * 100 + 'vw';

  h.style.fontSize =
    (18 + Math.random() * 20) + 'px';

  document.body.appendChild(h);

  setTimeout(() => {
    h.remove();
  }, 6000);
}

/* Background decoration */
setInterval(() => {
  if (!finished) {
    makeHeart();
  }
}, 1500);

/* Start */
no.disabled = true;
no.textContent = 'ပုံများပြင်ဆင်နေသည်...';

prepareGifs();

</script>

</body>
</html>
