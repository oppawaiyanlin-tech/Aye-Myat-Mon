
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Love Proposal ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #fff0f6, #fff8fc);
  font-family: system-ui, "Noto Sans Myanmar", sans-serif;
  color: #603449;
  overflow-x: hidden;
}

.card {
  width: 95%;
  max-width: 550px;
  min-height: 650px;
  background: white;
  border-radius: 28px;
  box-shadow: 0 12px 45px #e782ab35;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px 12px;
  position: relative;
  margin: 20px auto;
}

#question {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 {
  width: 100%;
  font-size: clamp(25px, 7vw, 38px);
  color: #dd568a;
  margin: 15px 0 30px;
  white-space: nowrap;
}

#media {
  width: min(70vw, 260px);
  height: 230px;
  object-fit: contain;
  display: block;
  margin: 0 auto;
}

#text {
  position: relative;
  z-index: 20;
  display: block;
  width: 100%;
  min-height: 65px;
  margin: 25px auto 30px;
  padding: 8px 2px;
  color: #603449;
  font-size: 25px;
  font-weight: 800;
  line-height: 1.7;
  text-align: center;
  white-space: nowrap;
  overflow: visible;
  background: white;
}

.buttons {
  position: relative;
  width: 100%;
  height: 150px;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 15px;
  overflow: visible;
  isolation: isolate;
}

button {
  border: none;
  border-radius: 22px;
  padding: 17px 20px;
  min-height: 75px;
  color: white;
  font-family: inherit;
  font-weight: bold;
  font-size: 21px;
  white-space: nowrap;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

#yes {
  background: #20b45a;
  position: relative;
  z-index: 5;
  transform: scale(1);
  transform-origin: center center;
  transition: transform 0.25s ease;
}

#no {
  background: #f16b65;
  position: relative;
  z-index: 4;
  transition: left 0.18s ease, top 0.18s ease;
}

#loading {
  font-size: 14px;
  color: #d45c91;
  margin-top: 8px;
}

#finish {
  display: none;
  width: 100%;
  text-align: center;
  padding: 25px 0;
}

#finish .headline {
  font-size: clamp(35px, 9vw, 48px);
  font-weight: 900;
  color: #e45591;
  margin: 20px 0;
}

#finish .finaltext {
  width: 100%;
  white-space: nowrap;
  font-size: 26px;
  font-weight: 900;
  color: #d54f87;
  margin: 25px auto;
  overflow: visible;
}

#finish img {
  width: min(75vw, 280px);
  height: 250px;
  object-fit: contain;
  margin-top: 15px;
}

.heart {
  position: fixed;
  top: -45px;
  pointer-events: none;
  animation: fall 5s linear forwards;
  z-index: 30;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(300deg);
    opacity: 0;
  }
}

@media (max-width: 380px) {
  .card {
    padding-left: 8px;
    padding-right: 8px;
  }

  .buttons {
    gap: 8px;
  }

  button {
    padding: 14px 12px;
  }
}
</style>
</head>

<body>

<main class="card">

<section id="question">

<h1>__PAGE_TITLE__</h1>

<img
  id="media"
  src="/static/gifs/intro.gif"
  alt="Love GIF"
>

<div id="text">__PAGE_MESSAGE__</div>

<div class="buttons" id="buttons">

<button id="yes">ချစ်တယ် ❤️</button>

<button id="no" disabled>ခဏစောင့်ပါ 💗</button>

</div>

<div id="loading">GIF ပုံများကို ကြိုတင်ပြင်ဆင်နေပါတယ် 💗</div>

</section>

<section id="finish">

<div class="headline">ယေး! 🎉</div>

<div class="finaltext">
ကိုယ်လည်း မင်းကို အရမ်းချစ်ပါတယ် ❤️
</div>

<img
  src="/static/gifs/yes.gif"
  alt="Happy GIF"
>

</section>

</main>

<script>
const messages = [
  'အာ့လိုကြီးတော့ မငြင်းပါနဲ့ဗျာ 🥺',
  'ငိုမှာနော် 😢',
  'မရက်စက်လိုက်ပါနဲ့နော် 💔',
  'တစ်ခါလောက်တော့ စဉ်းစားပေးပါဦး 🥹',
  'အရမ်းချစ်မိနေလို့ပါနော် 🥺',
  'နောက်တစ်ခါလောက် ပြန်စဉ်းစားပေးပါနော် 🤗',
  'ချစ်တယ်ပြောရင် မုန့်ဝယ်ကျွေးမယ်နော် 🥲',
  'ကဲပါကွာ... ချစ်တယ်လို့ပဲ ပြောလိုက်ပါတော့နော် 💗'
];

const gifPaths = [
  '/static/gifs/step1.gif',
  '/static/gifs/step2.gif',
  '/static/gifs/step3.gif',
  '/static/gifs/step4.gif',
  '/static/gifs/step5.gif',
  '/static/gifs/step6.gif',
  '/static/gifs/step7.gif',
  '/static/gifs/step8.gif'
];

let clicks = 0;
let finished = false;
let gifsReady = false;

const yes = document.getElementById('yes');
const no = document.getElementById('no');
const text = document.getElementById('text');
const media = document.getElementById('media');
const loading = document.getElementById('loading');

const question = document.getElementById('question');
const finish = document.getElementById('finish');
const buttons = document.getElementById('buttons');

const preloadedGifs = [];

// စာသားကို တစ်ကြောင်းတည်းနဲ့ အကျယ်အဝန်းအတွင်း ဆန့်အောင်ချိန်မယ်
function fitText(element, maxSize, minSize) {
  let size = maxSize;

  element.style.fontSize = size + 'px';

  while (
    element.scrollWidth > element.clientWidth &&
    size > minSize
  ) {
    size--;
    element.style.fontSize = size + 'px';
  }
}

// GIF အားလုံးကို ကြိုတင် Load လုပ်မယ်
function preloadGif(path) {
  return new Promise((resolve) => {
    const img = new Image();

    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);

    img.src = path;
  });
}

async function prepareGifs() {
  const paths = [
    '/static/gifs/intro.gif',
    ...gifPaths,
    '/static/gifs/yes.gif'
  ];

  const results = await Promise.all(
    paths.map(path => preloadGif(path))
  );

  results.forEach((img, index) => {
    if (img) {
      preloadedGifs[index] = img;
    }
  });

  gifsReady = true;

  no.disabled = false;
  no.textContent = 'မချစ်ဘူး 💔';

  loading.style.display = 'none';
}

function changeGif(index) {
  const img = preloadedGifs[index + 1];

  if (img) {
    media.src = img.src;
  } else {
    media.src = gifPaths[index];
  }
}

// NO ခလုတ်ကို Buttons နေရာအတွင်း ရွှေ့မယ်
function moveNo() {
  const maxX = Math.max(
    0,
    buttons.clientWidth - no.offsetWidth - 8
  );

  const maxY = Math.max(
    0,
    buttons.clientHeight - no.offsetHeight - 8
  );

  no.style.position = 'absolute';
  no.style.left = Math.round(Math.random() * maxX) + 'px';
  no.style.top = Math.round(Math.random() * maxY) + 'px';
}

// NO နှိပ်လိုက်တဲ့အခါ
no.addEventListener('click', () => {

  if (finished || !gifsReady || clicks >= 8) {
    return;
  }

  const index = clicks;

  // စာသားနှင့် GIF တစ်ပြိုင်နက် ပြောင်းမယ်
  text.textContent = messages[index];
  changeGif(index);

  fitText(text, 27, 13);

  clicks++;

  // YES ခလုတ်ကို တဖြည်းဖြည်း ကြီးလာစေမယ်
  const growth = 1 + clicks * 0.17;

  yes.style.transform = `scale(${growth})`;

  // ၈ ကြိမ်မြောက်တွင် NO ကို လုံးဝဖုံးမယ်
  if (clicks >= 8) {
    no.style.visibility = 'hidden';
    yes.style.transform = 'scale(2.5)';
  } else {
    moveNo();
  }
});

// YES နှိပ်လိုက်တဲ့အခါ
yes.addEventListener('click', () => {

  if (finished) return;

  finished = true;

  question.style.display = 'none';
  finish.style.display = 'block';

  const finalText = finish.querySelector('.finaltext');

  fitText(finalText, 30, 12);

  // နှလုံးပုံလေးတွေ ကြွေကျမယ်
  for (let i = 0; i < 40; i++) {
    setTimeout(makeHeart, i * 75);
  }
});

// နှလုံးပုံလေးများ
function makeHeart() {

  const heart = document.createElement('span');

  heart.className = 'heart';

  heart.textContent = [
    '💗',
    '💕',
    '💖',
    '🌸',
    '💞'
  ][Math.floor(Math.random() * 5)];

  heart.style.left = Math.random() * 100 + 'vw';

  heart.style.fontSize =
    (18 + Math.random() * 25) + 'px';

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 6000);
}

// နောက်ခံနှလုံးပုံများ
setInterval(() => {
  if (!finished) {
    makeHeart();
  }
}, 1100);

// စာသားအရွယ်အစားကို ဖုန်းအကျယ်အလိုက် ချိန်မယ်
window.addEventListener('resize', () => {
  fitText(text, 27, 13);

  const finalText = finish.querySelector('.finaltext');

  fitText(finalText, 30, 12);
});

// စတင်ချိန်
fitText(text, 27, 13);

prepareGifs();

</script>

</body>
</html>
