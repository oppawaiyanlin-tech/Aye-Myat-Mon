
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love Proposal ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg,#fff0f6,#fff8fc);
  font-family: system-ui,"Noto Sans Myanmar",sans-serif;
  color: #603449;
  overflow-x: hidden;
  padding: 20px 0;
}

.card {
  width: 95%;
  max-width: 550px;
  min-height: 520px;
  background: white;
  border-radius: 25px;
  box-shadow: 0 12px 45px #e782ab35;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px 15px;
  position: relative;
}

#question {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 {
  font-size: clamp(20px,5vw,30px);
  color: #dd568a;
  margin: 15px 0 20px;
}

#media {
  width: min(65vw,230px);
  height: 205px;
  object-fit: contain;
}

#text {
  font-size: clamp(15px,4vw,20px);
  font-weight: bold;
  line-height: 1.8;
  margin: 15px 0 25px;
  min-height: 45px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.buttons {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 22px;
  width: 100%;
  min-height: 180px;
  padding: 10px 0 20px;
}

button {
  border: 0;
  border-radius: 18px;
  color: white;
  font-weight: bold;
  cursor: pointer;
  white-space: nowrap;
  touch-action: manipulation;
}

#yes {
  background: #20b45a;
  font-size: calc(17px * var(--grow,1));
  padding: calc(14px * var(--grow,1))
           calc(22px * var(--grow,1));
  max-width: 95%;
  transition: font-size .25s ease, padding .25s ease;
  z-index: 2;
}

#no {
  background: #f16b65;
  font-size: 17px;
  padding: 14px 22px;
  position: relative;
  transition: transform .2s ease;
  z-index: 3;
}

#finish {
  display: none;
  width: 100%;
  text-align: center;
}

#finish .headline {
  font-size: clamp(23px,6vw,34px);
  font-weight: 800;
  color: #e45591;
  margin: 15px 0;
}

#finish .finaltext {
  white-space: nowrap;
  font-size: clamp(10px,3.1vw,18px);
  font-weight: bold;
  color: #d54f87;
}

#finish img {
  width: min(70vw,250px);
  height: 230px;
  object-fit: contain;
  margin-top: 16px;
}

.heart {
  position: fixed;
  top: -40px;
  pointer-events: none;
  animation: fall 5s linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(300deg);
    opacity: 0;
  }
}

@media(max-width:380px) {
  .card {
    padding: 20px 10px;
  }

  #yes {
    font-size: min(calc(17px * var(--grow,1)), 10vw);
  }
}
</style>
</head>

<body>

<main class="card">

<section id="question">

<h1>__PAGE_TITLE__</h1>

<img id="media"
     src="/static/gifs/intro.gif"
     alt="Love GIF">

<div id="text">__PAGE_MESSAGE__</div>

<div class="buttons" id="buttons">

<button id="yes">ချစ်တယ် ❤️</button>

<button id="no">မချစ်ဘူး 💔</button>

</div>
</section>

<section id="finish">

<div class="headline">ယေး! 🎉</div>

<div class="finaltext">
ဖိတ်စာရိုက်ခိုင်းလိုက်တော့မယ်နော် 💌
</div>

<img src="/static/gifs/yes.gif" alt="Happy GIF">

</section>

</main>

<script>
const messages = [
  'အာ့လိုကြီးတော့ မငြင်းပါနဲ့ဗျာ 🥺',
  'ငိုမှာနော် 😢',
  'မရက်စက်လိုက်ပါနဲ့ 💔',
  'တစ်ခါလောက်တော့ စဉ်းစားပေးပါဦး 🥹',
  'ကိုယ်ကတော့ အရမ်းချစ်နေတာနော် 🥺',
  'နောက်တစ်ခါလောက် ပြန်စဉ်းစားပေးပါ 😿',
  'YES လေးနှိပ်ပေးရင် မုန့်ဝယ်ကျွေးမယ် 🥲',
  'ကဲပါကွာ... ချစ်တယ်လို့ပဲ ပြောလိုက်ပါတော့နော် 💗'
];

let clicks = 0;
let finished = false;

const yes = document.getElementById('yes');
const no = document.getElementById('no');
const text = document.getElementById('text');
const media = document.getElementById('media');

const question = document.getElementById('question');
const finish = document.getElementById('finish');

// NO button ကို ကိုယ့်နေရာအတွင်းမှာ ရွှေ့ပေးမယ်
function moveNo() {
  const x = Math.round((Math.random() - 0.5) * 50);
  const y = Math.round((Math.random() - 0.5) * 18);

  no.style.transform = `translate(${x}px, ${y}px)`;
}

// NO ကို နှိပ်တဲ့အခါ စာသားနဲ့ GIF တစ်ပြိုင်နက်ပြောင်းမယ်
no.addEventListener('click', () => {

  if (finished || clicks >= 8) return;

  const index = clicks;

  // စာသားပြောင်းမယ်
  text.textContent = messages[index];

  // GIF ချက်ချင်းပြောင်းမယ်
  media.src = `/static/gifs/step${index + 1}.gif`;

  // YES ခလုတ် ကြီးလာမယ်
  clicks++;

  const grow = Math.min(1 + clicks * 0.17, 2.36);
  yes.style.setProperty('--grow', grow);

  // NO ခလုတ်ကို ရွှေ့မယ်
  moveNo();

});

// YES နှိပ်ရင် နောက်ဆုံးစာမျက်နှာပြမယ်
yes.addEventListener('click', () => {

  if (finished) return;

  finished = true;

  question.style.display = 'none';
  finish.style.display = 'block';

  for (let i = 0; i < 40; i++) {
    setTimeout(makeHeart, i * 75);
  }

});

// နှလုံးပုံလေးတွေ
function makeHeart() {

  const h = document.createElement('span');

  h.className = 'heart';

  h.textContent = ['💗','💕','💖','🌸'][
    Math.floor(Math.random() * 4)
  ];

  h.style.left = Math.random() * 100 + 'vw';

  h.style.fontSize = (18 + Math.random() * 20) + 'px';

  document.body.appendChild(h);

  setTimeout(() => h.remove(), 6000);
}

setInterval(() => {
  if (!finished) makeHeart();
}, 1100);

</script>

</body>
</html>
