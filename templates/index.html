<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love Proposal ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#fff0f6,#fff8fc);font-family:system-ui,"Noto Sans Myanmar",sans-serif;color:#603449;overflow:hidden}
.card{width:95%;max-width:550px;min-height:520px;background:white;border-radius:25px;box-shadow:0 12px 45px #e782ab35;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px 10px;position:relative}
h1{font-size:clamp(20px,5vw,30px);color:#dd568a}
#media{width:min(65vw,230px);height:205px;object-fit:contain}
#text{font-size:clamp(15px,4vw,20px);font-weight:bold;line-height:1.8;margin:15px 0}
.buttons{display:flex;align-items:center;justify-content:center;gap:15px;min-height:130px;width:100%;position:relative}
button{border:0;border-radius:14px;padding:14px 20px;color:white;font-weight:bold;font-size:17px}
#yes{background:#20b45a;transform:scale(var(--grow,1));transition:transform .3s;z-index:3}
#no{background:#f16b65;z-index:2}
#finish{display:none;width:100%}
#finish .headline{font-size:clamp(23px,6vw,34px);font-weight:800;color:#e45591;margin:15px 0}
#finish .finaltext{white-space:nowrap;font-size:clamp(10px,3.1vw,18px);font-weight:bold;color:#d54f87}
#finish img{width:min(70vw,250px);height:230px;object-fit:contain;margin-top:16px}
.heart{position:fixed;top:-40px;pointer-events:none;animation:fall 5s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(300deg);opacity:0}}
</style>
</head>
<body>
<main class="card">
<section id="question">
<h1>__PAGE_TITLE__</h1>
<img id="media" src="/static/gifs/intro.gif" alt="Love GIF">
<div id="text">__PAGE_MESSAGE__</div>
<div class="buttons" id="buttons">
<button id="yes">ချစ်တယ် ❤️</button>
<button id="no">မချစ်ဘူး 💔</button>
</div>
</section>

<section id="finish">
<div class="headline">ယေး! 🎉</div>
<div class="finaltext">ဖိတ်စာရိုက်ခိုင်းလိုက်တော့မယ်နော် 💌</div>
<img src="/static/gifs/yes.gif" alt="Happy GIF">
</section>
</main>

<script>
const messages=[
'အာ့လိုကြီးတော့ မငြင်းပါနဲ့ဗျာ 🥺',
'ငိုမှာနော် 😢',
'မရက်စက်လိုက်ပါနဲ့ 💔',
'တစ်ခါလောက်တော့ စဉ်းစားပေးပါဦး 🥹',
'ကိုယ်ကတော့ အရမ်းချစ်နေတာနော် 🥺',
'နောက်တစ်ခါလောက် ပြန်စဉ်းစားပေးပါ 😿',
'YES လေးနှိပ်ပေးရင် မုန့်ဝယ်ကျွေးမယ် 🥲',
'ကဲပါကွာ... ချစ်တယ်လို့ပဲ ပြောလိုက်ပါတော့နော် 💗'
];

let clicks=0;
let grow=1;
let finished=false;

const yes=document.getElementById('yes');
const no=document.getElementById('no');
const text=document.getElementById('text');
const media=document.getElementById('media');

function moveNo(){
 const area=document.getElementById('buttons');
 const maxX=Math.max(0,area.clientWidth-no.offsetWidth);
 no.style.position='absolute';
 no.style.left=Math.round(Math.random()*maxX)+'px';
 no.style.top=Math.round(Math.random()*35+25)+'px';
}

no.addEventListener('click',()=>{
 if(finished)return;
 const i=Math.min(clicks,7);
 text.textContent=messages[i];
 media.src='/static/gifs/step'+(i+1)+'.gif';
 clicks++;
 grow=Math.min(1+clicks*.17,2.5);
 yes.style.setProperty('--grow',grow);
 moveNo();
});

yes.addEventListener('click',()=>{
 finished=true;
 document.getElementById('question').style.display='none';
 document.getElementById('finish').style.display='block';
 for(let i=0;i<40;i++)setTimeout(makeHeart,i*75);
});

function makeHeart(){
 const h=document.createElement('span');
 h.className='heart';
 h.textContent=['💗','💕','💖','🌸'][Math.floor(Math.random()*4)];
 h.style.left=Math.random()*100+'vw';
 h.style.fontSize=(18+Math.random()*20)+'px';
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),6000);
}

setInterval(()=>{
 if(!finished)makeHeart();
},1100);
</script>
</body>
</html>
