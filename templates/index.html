
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love Proposal ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg,#fff0f6,#fff8fc);
  font-family: system-ui,"Noto Sans Myanmar",sans-serif;
  color: #603449;
  overflow-x: hidden;
  padding: 15px 0;
}

.card {
  width: 95%;
  max-width: 550px;
  min-height: 520px;
  background: white;
  border-radius: 25px;
  box-shadow: 0 12px 45px #e782ab35;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 22px 12px;
  position: relative;
}

#question {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 {
  width: 100%;
  padding: 0 5px;
  font-size: 30px;
  font-weight: bold;
  color: #dd568a;
  line-height: 1.7;
  margin: 15px 0 20px;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
}

#media {
  width: min(65vw,230px);
  height: 205px;
  object-fit: contain;
  display: block;
}

#text {
  display: block;
  width: 100%;
  max-width: 100%;
  padding: 0 5px;
  font-size: 24px;
  font-weight: bold;
  line-height: 1.8;
  margin: 15px auto 20px;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
}

/* YES / NO ခလုတ်များ ဘေးတိုက် */
.buttons {
  width: 100%;
  height: 170px;
  position: relative;
  display: block;
  isolation: isolate;
}

button {
  border: 0;
  border-radius: 18px;
  color: white;
  font-weight: bold;
  cursor: pointer;
  white-space: nowrap;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

#yes {
  position: absolute;
  left: 28%;
  top: 50%;
  transform: translate(-50%,-50%) scale(var(--grow,1));
  transform-origin: center center;
  background: #20b45a;
  font-size: clamp(17px,4.5vw,24px);
  padding: 17px 23px;
  z-index: 5;
  transition: transform .3s ease;
}

#no {
  position: absolute;
  left: 72%;
  top: 50%;
  transform: translate(-50%,-50%);
  background: #f16b65;
  font-size: clamp(15px,4vw,20px);
  padding: 16px 20px;
  z-index: 2;
}

#no:disabled {
  opacity: .65;
  cursor: wait;
}

#loading {
  font-size: 13px;
  color: #d54f87;
  min-height: 20px;
  margin-top: -10px;
}

/* နောက်ဆုံး YES Screen */
#finish {
  display: none;
  width: 100%;
  text-align: center;
}

#finish .finaltext {
  display: block;
  width: 100%;
  padding: 0 5px;
  white-space: nowrap;
  font-size: 30px;
  font-weight: 900;
  color: #e45591;
  line-height: 1.8;
  margin: 25px auto;
  text-align: center;
  overflow: hidden;
}

#finish img {
  width: min(70vw,250px);
  height: 230px;
  object-fit: contain;
  margin-top: 16px;
}

/* နှလုံးပုံလေးများ */
.heart {
  position: fixed;
  top: -40px;
  pointer-events: none;
  animation: fall 5s linear forwards;
  z-index: 10;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(300deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<main class="card">

<section id="question">

<h1 id="pageTitle">__PAGE_TITLE__</h1>

<img
  id="media"
  src="/static/gifs/intro.gif"
  alt="Love GIF"
  loading="eager"
>

<div id="text">__PAGE_MESSAGE__</div>

<div class="buttons" id="buttons">

<button id="yes">ချစ်တယ် ❤️</button>

<button id="no" disabled>
ပုံများပြင်ဆင်နေသည်...
</button>

</div>

<div id="loading">
ပုံများကို ကြိုတင်ပြင်ဆင်နေပါတယ် 💗
</div>

</section>

<section id="finish">

<div class="finaltext" id="finalText">
ကိုယ်လည်း မင်းကိုအရမ်းချစ်ပါတယ် ❤
</div>

<img
  src="/static/gifs/yes.gif"
  alt="Happy GIF"
>

</section>

</main>

<script>

const messages = [
  'အာ့လိုကြီးတော့ မငြင်းပါနဲ့ဗျာ 🥺',
  'ငိုမှာနော် 😢',
  'မရက်စက်လိုက်ပါနော် 💔',
  'တစ်ခါလောက်တော့ စဉ်းစားပေးပါဦး 🥹',
  'အရမ်းချစ်မိနေလို့ပါနော် 🥺',
  'နောက်တစ်ခါလောက် ပြန်စဉ်းစားပေးပါနော် 😿',
  'ချစ်တယ်ပြောရင် မုန့်ဝယ်ကျွေးမယ်လေနော် 🥲',
  'ကဲပါကွာ... ချစ်တယ်လို့ပဲ ပြောလိုက်ပါတော့နော် 💗'
];

const gifPaths = [
  '/static/gifs/step1.gif',
  '/static/gifs/step2.gif',
  '/static/gifs/step3.gif',
  '/static/gifs/step4.gif',
  '/static/gifs/step5.gif',
  '/static/gifs/step6.gif',
  '/static/gifs/step7.gif',
  '/static/gifs/step8.gif'
];

let clicks = 0;
let finished = false;
let gifsReady = false;

const yes = document.getElementById('yes');
const no = document.getElementById('no');
const text = document.getElementById('text');
const media = document.getElementById('media');
const loading = document.getElementById('loading');

const question = document.getElementById('question');
const finish = document.getElementById('finish');

const pageTitle = document.getElementById('pageTitle');
const finalText = document.getElementById('finalText');

// စာသားကို တစ်ကြောင်းတည်းနဲ့ အကျယ်အလိုက် ချိန်ညှိမယ်
function fitSingleLine(element, maxSize, minSize = 8) {

  if (!element) return;

  element.style.fontSize = maxSize + 'px';

  let size = maxSize;

  // စာသား အကျယ်အတွင်း ဆန့်သည်အထိ အရွယ်အစားလျှော့မယ်
  while (
    element.scrollWidth > element.clientWidth &&
    size > minSize
  ) {
    size -= 0.5;
    element.style.fontSize = size + 'px';
  }
}

// စာသားအားလုံးကို အလိုအလျောက် ချိန်ညှိမယ်
function fitAllText() {

  fitSingleLine(pageTitle, 34, 12);
  fitSingleLine(text, 26, 8);
  fitSingleLine(finalText, 32, 8);

}

// GIF များကို ကြိုတင် Load လုပ်မယ်
function preloadGif(path) {

  return new Promise((resolve) => {

    const img = new Image();

    img.onload = async () => {

      try {
        if (img.decode) {
          await img.decode();
        }
      } catch (e) {
        // Browser decode မရလည်း Load ပြီးပါက ဆက်လုပ်မယ်
      }

      resolve(true);
    };

    img.onerror = () => resolve(false);

    img.src = path;

  });
}

// GIF ၈ ပုံလုံး ကြိုတင်ပြင်ဆင်မယ်
async function prepareGifs() {

  const results = await Promise.all(
    gifPaths.map(path => preloadGif(path))
  );

  const failed = results.some(result => !result);

  if (failed) {

    loading.textContent =
      'GIF ဖိုင်တစ်ခုခုကို ပြန်စစ်ပေးပါ 💗';

    no.textContent = 'GIF မရသေးပါ';

    return;
  }

  gifsReady = true;

  no.disabled = false;

  no.textContent = 'မချစ်ဘူး 💔';

  loading.textContent = '';

}

// YES က NO ကို ဖုံးနိုင်မည့် Scale တွက်ချက်မယ်
function calculateCoverScale() {

  const yesRect = yes.getBoundingClientRect();
  const noRect = no.getBoundingClientRect();

  const centerX = yesRect.left + yesRect.width / 2;
  const centerY = yesRect.top + yesRect.height / 2;

  const halfWidth = yes.offsetWidth / 2;
  const halfHeight = yes.offsetHeight / 2;

  const requiredX = Math.max(
    Math.abs(noRect.left - centerX),
    Math.abs(noRect.right - centerX)
  ) / halfWidth;

  const requiredY = Math.max(
    Math.abs(noRect.top - centerY),
    Math.abs(noRect.bottom - centerY)
  ) / halfHeight;

  return Math.max(requiredX, requiredY) + 0.2;

}

// NO နှိပ်တိုင်း စာသားနဲ့ GIF ချက်ချင်းပြောင်းမယ်
no.addEventListener('click', () => {

  if (finished || !gifsReady || clicks >= 8) return;

  const index = clicks;

  // စာသားပြောင်းမယ်
  text.textContent = messages[index];

  // GIF ချက်ချင်းပြောင်းမယ်
  media.src = gifPaths[index];

  // စာသားအရှည်အလိုက် Font Size ချိန်မယ်
  fitSingleLine(text, 26, 8);

  clicks++;

  // YES ခလုတ် တစ်ဆင့်စီ ကြီးလာမယ်
  let grow = 1 + clicks * 0.30;

  // ၈ ကြိမ်မြောက်မှာ NO ကို လုံးဝဖုံးမယ်
  if (clicks === 8) {

    grow = Math.max(
      grow,
      calculateCoverScale()
    );

    no.disabled = true;

  }

  yes.style.setProperty('--grow', grow);

});

// YES နှိပ်လျှင် နောက်ဆုံး Screen ပြမယ်
yes.addEventListener('click', () => {

  if (finished) return;

  finished = true;

  question.style.display = 'none';

  finish.style.display = 'block';

  // နောက်ဆုံးစာသားကို အကျယ်နဲ့ ကိုက်အောင် ချိန်မယ်
  fitSingleLine(finalText, 32, 8);

  // နှလုံးပုံလေးများ ပေါ်လာမယ်
  for (let i = 0; i < 40; i++) {

    setTimeout(makeHeart, i * 75);

  }

});

// နှလုံးပုံလေးများ
function makeHeart() {

  const h = document.createElement('span');

  h.className = 'heart';

  h.textContent = [
    '💗',
    '💕',
    '💖',
    '🌸'
  ][Math.floor(Math.random() * 4)];

  h.style.left = Math.random() * 100 + 'vw';

  h.style.fontSize =
    (18 + Math.random() * 20) + 'px';

  document.body.appendChild(h);

  setTimeout(() => h.remove(), 6000);

}

// နှလုံးပုံလေးများ အလိုအလျောက်ကျမယ်
setInterval(() => {

  if (!finished) {
    makeHeart();
  }

}, 1100);

// ဖုန်းအရွယ်အစား ပြောင်းလဲရင် စာသားပြန်ချိန်မယ်
window.addEventListener('resize', fitAllText);

// Website ဖွင့်သည်နှင့် စာသားနှင့် GIF များ ပြင်ဆင်မယ်
fitAllText();
prepareGifs();

</script>

</body>
</html>
